[package]
name = "wordcraft-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft PDF export (craft-pdf / Krilla): embedded font subsets with selectable text, links, outline, tagging"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-geom = { workspace = true, features = ["image"] }
wordcraft-fonts = { workspace = true }
wordcraft-layout = { workspace = true }
wordcraft-metafile = { workspace = true }
craft-pdf = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
